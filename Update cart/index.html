<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Cart</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Your Cart</h1>

        <div id="cartItems">

            <!-- Chicken Biryani -->
            <div class="cart-item" data-price="180">

                <div class="item-details">
                    <h2>Chicken Biryani</h2>
                    <p>₹180 per item</p>
                </div>

                <div class="quantity-controls">
                    <button class="decrease">−</button>
                    <span class="quantity">1</span>
                    <button class="increase">+</button>
                </div>

                <div class="item-total">
                    ₹<span>180</span>
                </div>

            </div>


            <!-- Chicken Burger -->
            <div class="cart-item" data-price="150">

                <div class="item-details">
                    <h2>Chicken Burger</h2>
                    <p>₹150 per item</p>
                </div>

                <div class="quantity-controls">
                    <button class="decrease">−</button>
                    <span class="quantity">1</span>
                    <button class="increase">+</button>
                </div>

                <div class="item-total">
                    ₹<span>150</span>
                </div>

            </div>


            <!-- Margherita Pizza -->
            <div class="cart-item" data-price="200">

                <div class="item-details">
                    <h2>Margherita Pizza</h2>
                    <p>₹200 per item</p>
                </div>

                <div class="quantity-controls">
                    <button class="decrease">−</button>
                    <span class="quantity">1</span>
                    <button class="increase">+</button>
                </div>

                <div class="item-total">
                    ₹<span>200</span>
                </div>

            </div>

        </div>


        <!-- Cart Summary -->

        <div class="cart-summary">

            <h2>Order Summary</h2>

            <div class="summary-row">
                <span>Subtotal</span>
                <span>₹<span id="subtotal">530</span></span>
            </div>

            <div class="summary-row">
                <span>Tax (5%)</span>
                <span>₹<span id="tax">26.50</span></span>
            </div>

            <div class="summary-row total">
                <span>Total</span>
                <span>₹<span id="total">556.50</span></span>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>

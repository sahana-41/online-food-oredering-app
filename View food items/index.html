<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Menu</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>Food Menu</h1>

    <div class="menu-container">

        <div class="food-card">
            <img src="https://via.placeholder.com/250" alt="Burger">

            <h3>Chicken Burger</h3>

            <p class="description">
                Delicious chicken burger with cheese and fresh vegetables.
            </p>

            <p class="price">₹120</p>

            <span class="tag nonveg">Non-Veg</span>

            <p class="status in-stock">In Stock</p>

            <button>View Details</button>
        </div>

        <div class="food-card">
            <img src="https://via.placeholder.com/250" alt="Pizza">

            <h3>Veg Pizza</h3>

            <p class="description">
                Fresh vegetable pizza with mozzarella cheese.
            </p>

            <p class="price">₹250</p>

            <span class="tag veg">Veg</span>

            <p class="status out-stock">Out of Stock</p>

            <button>View Details</button>
        </div>

        <div class="food-card">
            <img src="https://via.placeholder.com/250" alt="Biryani">

            <h3>Chicken Biryani</h3>

            <p class="description">
                Hyderabadi style chicken biryani.
            </p>

            <p class="price">₹180</p>

            <span class="tag nonveg">Non-Veg</span>

            <p class="status in-stock">In Stock</p>

            <button>View Details</button>
        </div>

    </div>

    <div class="pagination">
        <button>Previous</button>
        <button>Next</button>
    </div>

</body>
</html>

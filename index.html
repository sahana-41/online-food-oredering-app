<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Delivery Addresses</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="header">
    <h2>Foodie<span>Express</span></h2>
    <a href="#checkout">Checkout</a>
  </header>

  <main class="container">
    <section class="address-section">
      <div class="heading">
        <div>
          <h1>Manage Addresses</h1>
          <p>Save and manage your delivery locations.</p>
        </div>
        <button class="primary-btn" id="addBtn">
          + Add Address
        </button>
      </div>

      <div id="addressList" class="address-list"></div>

      <div id="emptyState" class="empty-state">
        <div class="empty-icon">📍</div>
        <h3>No addresses saved yet</h3>
        <p>Add your first delivery address to get started.</p>
        <button class="primary-btn" id="emptyAddBtn">
          Add Your First Address
        </button>
      </div>
    </section>

    <section class="checkout" id="checkout">
      <h2>Checkout</h2>
      <p>Select your delivery address.</p>
      <div id="selectedAddress" class="selected-address">
        No address selected
      </div>
      <button id="placeOrderBtn" class="primary-btn" disabled>
        Continue to Payment
      </button>
      <p id="checkoutMessage" class="message"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
